# Nginx reverse proxy for CRM TIRA — plain HTTP via IP:3031
# (stopgap while uat.tira-crm.meety.id's domain is compromised — no TLS here
# since Let's Encrypt can't issue a cert for a bare IP; see the domain-based
# config in this same folder for when DNS is trustworthy again.)
#
# Install: sudo cp this file to /etc/nginx/sites-available/tira-crm-ip
#          sudo ln -s /etc/nginx/sites-available/tira-crm-ip /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then open the port in the firewall if needed, e.g.:
#          sudo ufw allow 3031/tcp
#
# IMPORTANT: since this is plain HTTP (no TLS), the app's session cookie
# must NOT be marked Secure or the browser will silently drop it and login
# will appear to do nothing. Set COOKIE_SECURE=false in the app's .env for
# as long as it's served this way — see .env.example.

upstream tira_crm_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 3031;
  listen [::]:3031;
  server_name _;   # catch-all — matches any Host header, including the raw IP

  # Excel/JSON imports (prospect list, DB backup restore) can be a few MB.
  client_max_body_size 20m;

  # Realtime updates go over this path — must forward the WebSocket upgrade.
  location /socket.io/ {
    proxy_pass http://tira_crm_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400; # keep long-lived socket connections open
  }

  location / {
    proxy_pass http://tira_crm_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
