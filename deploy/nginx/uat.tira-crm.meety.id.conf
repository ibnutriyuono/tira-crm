# Nginx reverse proxy for CRM TIRA — uat.tira-crm.meety.id
#
# Install: sudo cp this file to /etc/nginx/sites-available/uat.tira-crm.meety.id
#          sudo ln -s /etc/nginx/sites-available/uat.tira-crm.meety.id /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then provision TLS with:  sudo certbot --nginx -d uat.tira-crm.meety.id
# (certbot's nginx plugin rewrites this file in place to add the 443/ssl
# server block and the automatic http->https redirect — don't hand-add
# ssl_certificate lines yourself, let certbot do it, then reload nginx.)

upstream tira_crm_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name uat.tira-crm.meety.id;

  # Excel/JSON imports (prospect list, DB backup restore) can be a few MB.
  client_max_body_size 20m;

  # Realtime updates go over this path — must forward the WebSocket upgrade.
  location /socket.io/ {
    proxy_pass http://tira_crm_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400; # keep long-lived socket connections open
  }

  location / {
    proxy_pass http://tira_crm_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
